[project]
name = "ableton-mcp"
version = "1.3.0"
description = "Ableton Live integration through the Model Context Protocol — maintained fork with clip readback, mixer control, and Live API scripting"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
maintainers = [
    {name = "aarx0"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "supabase>=2.0.0",
]

[project.scripts]
ableton-mcp = "MCP_Server.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server"]

[project.urls]
"Homepage" = "https://github.com/aarx0/ableton-mcp"
"Bug Tracker" = "https://github.com/aarx0/ableton-mcp/issues"
"Changelog" = "https://github.com/aarx0/ableton-mcp/blob/main/CHANGELOG.md"
"Upstream" = "https://github.com/ahujasid/ableton-mcp"